<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <icon rel="icon" href="data/icon.png" type="image/png">
  <title>XISO Web Extractor</title>
  <link rel="stylesheet" href="data/main.css">
</head>
<body>
  <div class="card">
    <div class="header-row">
      <h2 id="titleText">Xbox 360 ISO Extractor</h2>
      <div class="lang-switch">
        <button type="button" id="btnLangId" class="lang-btn active">ID</button>
        <button type="button" id="btnLangEn" class="lang-btn">EN</button>
      </div>
    </div>
    <p id="descText">Pilih file .ISO game Xbox 360 dan folder tujuan di Perangkat Anda.</p>
    
    <label id="labelStep1">1. Pilih File ISO Xbox 360 (Bisa lebih dari 1):</label>
    <input type="file" id="isoInput" accept=".iso" multiple>
    
    <label id="labelStep2" style="margin-top: 15px; display:block;">2. Ekstrak ke Folder:</label>
    <button id="btnExtract" disabled>Pilih Folder & Ekstrak Game</button>
    
    <div id="log">Status: Menunggu file ISO...</div>
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <p style="text-align: center;" id="progress">Progress: 0%</p>
  </div>

  <script src="data/xiso-parser.js"></script>
  <script src="data/app.js"></script>
</body>
</html>
